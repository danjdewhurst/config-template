# Where the config gets linked. Each entry is <agent dir>:<filename>: the
# directory is created if missing, and the agent's render of AGENTS.src.md is
# linked into it under that filename. The tag name for the agent in AGENTS.src.md is the
# directory without the dot: ~/.codex is <codex>.
#
# Don't edit this file to add a machine's own agents. Put the same syntax in
# ~/.ai-config.local, which install.sh and build.sh source after this file, so
# it wins:
#
#   AGENT_DIRS+=("$HOME/.gemini:GEMINI.md")   # add one
#   AGENT_DIRS=("$HOME/.claude:CLAUDE.md")    # or replace the list
AGENT_DIRS=(
  "$HOME/.claude:CLAUDE.md"
  "$HOME/.agents:AGENTS.md"
  "$HOME/.codex:AGENTS.md"
)

# Where every skill in skills/ is linked. Not ~/.codex/skills: Codex reads
# ~/.agents/skills too, so a link in both shows each skill to it twice.
SKILL_DIRS=(
  "$HOME/.claude/skills"
  "$HOME/.agents/skills"
)
