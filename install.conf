# shellcheck shell=bash disable=SC2034
# Your choices for install.sh. Commit this file: it is shared by every machine.
# To change a value on one machine only, set it again in ~/.ai-config.local.

# Flags for the `claude` alias that install.sh writes into your shell rc file.
# Empty keeps Claude Code's normal permission prompts. If you trust your setup,
# you can use "--dangerously-skip-permissions". Read the Claude Code docs first.
CLAUDE_FLAGS=""

# Your NextDNS profile ID (six characters, from my.nextdns.io). When set, Linux
# machines use NextDNS over TLS as their system resolver. Empty skips it.
NEXTDNS_ID=""

# The launchd label for the clipboard image server on macOS. See clipboard/.
# Empty skips the server.
CLIPBOARD_LABEL="local.clipboard-image"
